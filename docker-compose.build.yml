# ─────────────────────────────────────────────────────────────────────────────
# Rara Agent — docker-compose override for LOCAL builds
#
# Use this when you want to build the image from source instead of pulling
# the pre-built image from GHCR (e.g. for testing uncommitted code).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# This overrides the `image:` directive in docker-compose.yml with a `build:`
# directive, so Docker builds from the local Dockerfile.
# ─────────────────────────────────────────────────────────────────────────────
services:
  rara:
    image: rara-agent:local   # local-only tag, never pushed to registry
    pull_policy: never         # never try to pull — always build locally
    build:
      context: .
      dockerfile: Dockerfile
