# ─────────────────────────────────────────────────────────────────────────────
# Rara Agent — production docker-compose
#
# Default: pulls pre-built image from GitHub Container Registry.
#   docker compose up -d
#
# To build locally instead (e.g. for testing uncommitted changes):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# To update to the latest pushed image:
#   docker compose pull && docker compose up -d
#
# Logs:
#   docker compose logs -f rara
#
# Stop + wipe volumes:
#   docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────
services:
  rara:
    # Pre-built image — auto-built by GitHub Actions on every push to main.
    # See .github/workflows/docker-publish.yml
    image: ghcr.io/yz776/rara-agent:latest
    container_name: rara
    restart: unless-stopped
    pull_policy: always
    ports:
      # Expose ONLY the Next.js port. zrouter stays on 127.0.0.1:3001 inside the container.
      - "3000:3000"
    environment:
      # Required secrets (generate with openssl rand).
      # Values must be QUOTED in YAML because ${VAR:?error message} contains colons
      # which YAML would otherwise parse as nested mapping separators.
      KROUTER_INTERNAL_TOKEN: "${KROUTER_INTERNAL_TOKEN:?KROUTER_INTERNAL_TOKEN must be set}"
      KFAI_AUTH_SECRET: "${KFAI_AUTH_SECRET:?KFAI_AUTH_SECRET must be set}"

      # zrouter dashboard login (for ops who want to manage pool keys).
      KROUTER_ADMIN_USERNAME: "${KROUTER_ADMIN_USERNAME:-admin}"
      KROUTER_ADMIN_PASSWORD: "${KROUTER_ADMIN_PASSWORD:?KROUTER_ADMIN_PASSWORD must be set}"

      # Internal routing.
      KROUTER_BASE: "http://127.0.0.1:3001"
      MCP_ENDPOINT: "http://127.0.0.1:3001/mcp"
      RARA_BASE_URL: "http://127.0.0.1:3000"

      # Next.js.
      DATABASE_URL: "file:/app/db/rara.db"
      NODE_ENV: "production"

      # zrouter.
      HOST: "0.0.0.0"
      PORT: "3000"
      KROUTER_DATA_DIR: "/app/data/mini-services/zrouter/data"

      # Rate limits (per IP / hour) — override via env.
      RATE_LIMIT_LOGIN_PER_HOUR: "${RATE_LIMIT_LOGIN_PER_HOUR:-30}"
      RATE_LIMIT_CHAT_PER_HOUR: "${RATE_LIMIT_CHAT_PER_HOUR:-120}"
      RATE_LIMIT_CAPTCHA_PER_HOUR: "${RATE_LIMIT_CAPTCHA_PER_HOUR:-30}"
      RATE_LIMIT_DEVICE_PER_HOUR: "${RATE_LIMIT_DEVICE_PER_HOUR:-200}"
      RATE_LIMIT_ADMIN_PER_HOUR: "${RATE_LIMIT_ADMIN_PER_HOUR:-300}"
    volumes:
      # Persistent Prisma DB (users, conversations, sessions).
      - rara_db:/app/db
      # Persistent zrouter state (config.json + krouter.db + auth.db + proxies.db + key_pool).
      - rara_data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  rara_db:
  rara_data:
