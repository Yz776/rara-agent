# ─────────────────────────────────────────────────────────────────────────────
# Rara Agent — production docker-compose (self-contained, no zrouter)
#
# Default: pulls pre-built image from GitHub Container Registry.
#   docker compose up -d
#
# To build locally instead (e.g. for testing uncommitted changes):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# To update to the latest pushed image:
#   docker compose pull && docker compose up -d
#
# Logs:
#   docker compose logs -f rara
#
# Stop + wipe volumes:
#   docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────
services:
  rara:
    # Pre-built image — auto-built by GitHub Actions on every push to main.
    image: ghcr.io/yz776/rara-agent:latest
    container_name: rara
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${RARA_HOST_PORT:-8080}:3000"
    environment:
      # Required secrets (generate with openssl rand).
      KFAI_AUTH_SECRET: "${KFAI_AUTH_SECRET:?KFAI_AUTH_SECRET must be set}"
      KROUTER_ADMIN_PASSWORD: "${KROUTER_ADMIN_PASSWORD:?KROUTER_ADMIN_PASSWORD must be set}"

      # Admin panel login (for ops who want to manage users / view logs).
      KROUTER_ADMIN_USERNAME: "${KROUTER_ADMIN_USERNAME:-admin}"

      # Optional: real opencode.ai account Bearer. Defaults to free-tier "public".
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"

      # Next.js.
      DATABASE_URL: "file:/app/db/rara.db"
      NODE_ENV: "production"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      RARA_BASE_URL: "http://127.0.0.1:3000"

      # Legacy env kept for backward-compat — no longer used to reach an
      # external zrouter. All AI calls go directly to https://opencode.ai.
      KROUTER_BASE: ""
      KROUTER_INTERNAL_TOKEN: ""
      MCP_ENDPOINT: ""

      # Rate limits (per IP / hour) — override via env.
      RATE_LIMIT_LOGIN_PER_HOUR: "${RATE_LIMIT_LOGIN_PER_HOUR:-30}"
      RATE_LIMIT_CHAT_PER_HOUR: "${RATE_LIMIT_CHAT_PER_HOUR:-120}"
      RATE_LIMIT_ADMIN_PER_HOUR: "${RATE_LIMIT_ADMIN_PER_HOUR:-300}"
    volumes:
      # Persistent Prisma DB (users, conversations, sessions, sandbox files).
      - rara_db:/app/db
      # Persistent sandbox file storage (per-user files saved by tools).
      - rara_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  rara_db:
  rara_data:
