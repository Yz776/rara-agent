# ─────────────────────────────────────────────────────────────────────────────
# Rara Agent — production docker-compose
#
# Run:
#   docker compose up -d --build
#
# Logs:
#   docker compose logs -f rara
#
# Stop + wipe volumes:
#   docker compose down -v
# ─────────────────────────────────────────────────────────────────────────────
services:
  rara:
    build:
      context: .
      dockerfile: Dockerfile
    image: rara-agent:latest
    container_name: rara
    restart: unless-stopped
    ports:
      # Expose ONLY the Next.js port. zrouter stays on 127.0.0.1:3001 inside the container.
      - "3000:3000"
    environment:
      # ── Required secrets (generate with openssl rand) ────────────────────
      # These MUST be set before first boot. Bootstrap mode is disabled when
      # KROUTER_INTERNAL_TOKEN is set, so without it zrouter refuses ALL
      # unauthenticated calls (including from Next.js — which would break).
      KROUTER_INTERNAL_TOKEN: ${KROUTER_INTERNAL_TOKEN:?must be set — generate with: openssl rand -hex 32}
      KFAI_AUTH_SECRET: ${KFAI_AUTH_SECRET:?must be set — generate with: openssl rand -hex 24}

      # ── zrouter dashboard login (for ops who want to manage pool keys
      # via the admin UI at http://<host>:3001 from inside the container —
      # reachable via `docker exec -it rara curl http://127.0.0.1:3001/`)
      KROUTER_ADMIN_USERNAME: ${KROUTER_ADMIN_USERNAME:-admin}
      KROUTER_ADMIN_PASSWORD: ${KROUTER_ADMIN_PASSWORD:?must be set — generate with: openssl rand -base64 18}

      # ── Internal routing ─────────────────────────────────────────────────
      # Next.js server uses this to call the embedded zrouter over localhost.
      KROUTER_BASE: http://127.0.0.1:3001
      MCP_ENDPOINT: http://127.0.0.1:3001/mcp
      RARA_BASE_URL: http://127.0.0.1:3000

      # ── Next.js ──────────────────────────────────────────────────────────
      DATABASE_URL: file:/app/db/rara.db
      NODE_ENV: production

      # ── zrouter ──────────────────────────────────────────────────────────
      HOST: 0.0.0.0
      PORT: 3000
      KROUTER_DATA_DIR: /app/data/mini-services/zrouter/data
    volumes:
      # Persistent Prisma DB (users, conversations, sessions)
      - rara_db:/app/db
      # Persistent zrouter state (config.json + krouter.db + auth.db + proxies.db + key_pool)
      - rara_data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  rara_db:
  rara_data:
