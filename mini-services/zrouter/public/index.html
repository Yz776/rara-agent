}

// ─── Logs ─────────────────────────────────────────────────────────────
async function renderLogs() {
  const data = await api("GET", `/admin/api/logs?limit=${logsLimit}`).catch(() => ({ logs: [] }));
  const logs = data.logs || [];
  const opts = [50, 100, 250, 500].map(n => `<option value="${n}" ${n === logsLimit ? "selected" : ""}>${n}</option>`).join("");

  $("#main").innerHTML = `
    <div class="page-title">Request Logs</div>
    <div class="page-sub">Recent requests handled by the gateway. Click a row to see full details.</div>

    <div class="flex items-center gap-3 mb-4">
      <div class="field-group" style="margin:0;min-width:140px">
        <label for="logsLimitSel" class="text-xs text-muted">Limit</label>
        <select class="select" id="logsLimitSel" onchange="changeLogsLimit(this.value)">${opts}</select>
      </div>
      <div class="text-muted text-sm">Showing ${logs.length} log${logs.length === 1 ? "" : "s"}</div>
      <button class="btn secondary sm" style="margin-left:auto" onclick="renderLogs()" data-tooltip="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 1 1 2.13 9.36L1 14"/></svg>
      </button>
    </div>

    ${logs.length === 0 ? emptyState({
      icon: "clock",
      title: "No logs yet",
      message: "Once your gateway starts handling requests, they'll appear here with full details.",
    }) : `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Model</th><th>Provider</th><th class="right">Tokens (p/c/t)</th><th class="right">Latency</th><th>Status</th><th>Fallback</th></tr></thead>
          <tbody>
            ${logs.map((l, i) => {
              const time = l.createdAt;
              const model = l.model || "—";
              const provider = l.providerId || (typeof model === "string" ? model.split("/")[0] : "—");
              const pt = l.promptTokens || 0;
              const ct = l.completionTokens || 0;
              const tt = l.totalTokens || (pt + ct);
              const lat = l.latencyMs;
              const latClass = (typeof lat === "number" && lat > 1500) ? "slow" : (typeof lat === "number" && lat > 500 ? "med" : "fast");
              const latStr = (typeof lat === "number" && !isNaN(lat)) ? `${lat}ms` : "—";
              const status = l.statusCode || 200;
              const statusOk = status < 400;
              const fb = l.fallbackOccurred;
              const fbPath = l.fallbackPath;
              const fbReason = l.fallbackReason;
              const id = l.id || i;
              const expanded = logsExpanded.has(id);
              const cost = l.estimatedCost || 0;
              return `
                <tr class="log-row expandable" onclick="toggleLogRow('${id}')">
                  <td class="text-xs text-muted" style="white-space:nowrap">${fmtDate(time)}</td>
                  <td><code>${esc(model)}</code></td>
                  <td class="text-xs">${esc(provider)}</td>
                  <td class="num">${fmtNum(pt)} / ${fmtNum(ct)} / ${fmtNum(tt)}</td>
                  <td class="num lat ${latClass}">${latStr}</td>
                  <td><span class="badge ${statusOk ? "success" : "danger"}"><span class="dot ${statusOk ? "on" : "err"}"></span>${status}</span></td>
                  <td>${fb ? `<span class="tag fallback">yes</span>` : `<span class="text-muted text-xs">—</span>`}</td>
                </tr>
                ${expanded ? `
                  <tr class="log-row-detail">
                    <td colspan="7">
                      <div class="detail-grid">
                        <div class="item"><div class="lbl">Request ID</div><div class="val">${esc(l.id || "—")}</div></div>
                        <div class="item"><div class="lbl">API Key</div><div class="val">${esc(l.apiKeyId || "—")}</div></div>
                        <div class="item"><div class="lbl">Provider</div><div class="val">${esc(l.providerId || "—")}</div></div>
                        <div class="item"><div class="lbl">Model</div><div class="val">${esc(l.model || "—")}</div></div>
                        <div class="item"><div class="lbl">Prompt tokens</div><div class="val">${fmtNum(pt)}</div></div>
                        <div class="item"><div class="lbl">Completion tokens</div><div class="val">${fmtNum(ct)}</div></div>
                        <div class="item"><div class="lbl">Total tokens</div><div class="val">${fmtNum(tt)}</div></div>
                        <div class="item"><div class="lbl">Latency</div><div class="val">${latStr}</div></div>
                        <div class="item"><div class="lbl">Status</div><div class="val">${status}</div></div>
                        <div class="item"><div class="lbl">Est. cost</div><div class="val">${fmtMoney(cost)}</div></div>
                        <div class="item"><div class="lbl">Fallback</div><div class="val">${fb ? "yes" : "no"}</div></div>
                        ${fbPath ? `<div class="item"><div class="lbl">Fallback path</div><div class="val">${esc(fbPath)}</div></div>` : ""}
                        ${fbReason ? `<div class="item"><div class="lbl">Fallback reason</div><div class="val">${esc(fbReason)}</div></div>` : ""}
                        <div class="item"><div class="lbl">Created at</div><div class="val">${fmtDate(time)}</div></div>
                      </div>
                    </td>
                  </tr>
                ` : ""}
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
      ${logs.length >= logsLimit ? `
        <div class="flex items-center justify-between mt-4">
          <div class="text-muted text-xs">Showing the latest ${logs.length} logs.</div>
          <button class="btn secondary sm" onclick="loadMoreLogs()">Load more</button>
        </div>
      ` : ""}
    `}
  `;
}
function toggleLogRow(id) {
  if (logsExpanded.has(id)) logsExpanded.delete(id);
  else logsExpanded.add(id);
  renderLogs();
}
function changeLogsLimit(v) {
  logsLimit = parseInt(v) || 100;
  logsExpanded.clear();
  renderLogs();
}
function loadMoreLogs() {
  logsLimit = Math.min(2000, logsLimit * 2);
  renderLogs();
}

async function renderTokenSaver() {
  let cfg = tokenSaverState;
  if (!cfg) {
    const data = await api("GET", "/admin/api/token-saver").catch(() => ({}));
    cfg = data.settings || data || {};
    tokenSaverState = cfg;
  }
  const ts = cfg;
  const enabled = ts.enabled ?? false;
  const compressTool = ts.compressToolOutput ?? {};
  const ctoEnabled = compressTool.enabled ?? false;
  const ctoThreshold = compressTool.minCharacterThreshold ?? 1000;
  const lazyDev = ts.lazySeniorDev ?? {};
  const lazyEnabled = lazyDev.enabled ?? false;
  const lazyMode = lazyDev.mode || "balanced";
  const compressLlm = ts.compressLlmOutput ?? {};
  const cllmEnabled = compressLlm.enabled ?? false;
  const cllmMode = compressLlm.mode || "terse";
  const trim = ts.trimMessages ?? {};
  const trimEnabled = trim.enabled ?? false;
  const trimMax = trim.maxInputTokens ?? 8000;
  const trimTail = trim.preserveTailMessages ?? 4;

  // Estimated savings (rough heuristic)
  const savings = [
    enabled && ctoEnabled ? 15 : 0,

let tsSaveState = "saved";
function setTsSaveState(state) {
  tsSaveState = state;
  const ind = $("#tsSaveIndicator");
  const txt = $("#tsSaveText");
  if (!ind || !txt) return;
  ind.classList.remove("saving", "saved", "error");
  ind.classList.add(state);
  txt.textContent = state === "saving" ? "Saving…" : (state === "error" ? "Error" : "Saved");
}
function toggleTsCard(id) {
  const card = $("#tsCard_" + id);
  if (card) card.classList.toggle("expanded");
}
function toggleGlobalTs(checked) {
  setTsSaveState("saving");
  saveTokenSaver(true).finally(() => {
    setTimeout(() => setTsSaveState("saved"), 500);
  });
}
function onTsToggleChange(id, checked) {
  const card = $("#tsCard_" + id);
  if (card) {
    if (checked) card.classList.add("expanded");
    // Keep expanded even when unchecked so user can see what they're toggling
  }
}

let tsSaveTimer = null;
async function saveTokenSaver(silent = false) {
  const body = {
    enabled: $("#tsEnabled").checked,
    compressToolOutput: {
      enabled: $("#ts_cto_Enabled").checked,
      minCharacterThreshold: parseInt($("#tsCtoThreshold").value) || 0,
    },
    lazySeniorDev: {
      enabled: $("#ts_lazy_Enabled").checked,
      mode: $("#tsLazyMode").value,
    },
    compressLlmOutput: {
      enabled: $("#ts_cllm_Enabled").checked,
      mode: $("#tsCllmMode").value,
    },
    trimMessages: {
      enabled: $("#ts_trim_Enabled").checked,
      maxInputTokens: parseInt($("#tsTrimMax").value) || 0,
      preserveTailMessages: parseInt($("#tsTrimTail").value) || 0,
    },
  };
  if (!silent) setTsSaveState("saving");

// ─── Tunnel ───────────────────────────────────────────────────────────
async function renderTunnel() {
  try {
    const status = await api("GET", "/admin/api/tunnel/status");
    tunnelState.running = !!status.running;
    tunnelState.domain = status.domain || status.publicUrl || status.public_url || status.url || "";
    tunnelState.startedAt = status.startedAt || status.started_at || "";
    tunnelState.autostart = !!(status.autostart ?? status.autoStart ?? false);
    tunnelState.error = status.error || "";
  } catch {}
  drawTunnel();
  // Subscribe to SSE
  if (tunnelEventSource) { try { tunnelEventSource.close(); } catch {} tunnelEventSource = null; }
  try {
    tunnelEventSource = new EventSource("/admin/api/tunnel/events");
    tunnelEventSource.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.running !== undefined) tunnelState.running = !!d.running;
        if (d.domain || d.publicUrl) tunnelState.domain = d.domain || d.publicUrl;
        if (d.startedAt) tunnelState.startedAt = d.startedAt;
        if (d.autostart !== undefined) tunnelState.autostart = !!d.autostart;
        if (d.error !== undefined) tunnelState.error = d.error;
        drawTunnel();
      } catch {}
    };
    tunnelEventSource.onerror = () => {};
  } catch {}
}

async function startTunnel() {
  const token = $("#tunToken").value.trim();
  const domain = $("#tunDomain").value.trim();
  const body = {};
  if (token) body.token = token;
  if (domain) body.domain = domain;
  await withLoading("#startTunnelBtn", async () => {
    try {
      const r = await api("POST", "/admin/api/tunnel/start", body);
      if (r.domain) tunnelState.domain = r.domain;
      if (r.startedAt) tunnelState.startedAt = r.startedAt;
      tunnelState.running = !r.error;
      if (r.error) {
        toast("Tunnel error: " + r.error, "error", 5000);
      } else {
        toast("Tunnel started" + (r.domain ? " — " + r.domain : ""), "success");
      }
      drawTunnel();
    } catch (e) { toast(e.message, "error"); }
  });
}
async function stopTunnel() {
  await withLoading("#stopTunnelBtn", async () => {
    try {
      await api("POST", "/admin/api/tunnel/stop", {});
      tunnelState.running = false;
      tunnelState.domain = "";
      tunnelState.startedAt = "";
      toast("Tunnel stopped", "success");
      drawTunnel();
    } catch (e) { toast(e.message, "error"); }
  });
}
async function patchTunnel() {
  const autostart = $("#tunAutostart").checked;
  const token = $("#tunToken").value.trim();
  const domain = $("#tunDomain").value.trim();
  const body = { autostart };
  if (token) body.token = token;
  if (domain) body.domain = domain;
  await withLoading("#patchTunnelBtn", async () => {
    try {
      await api("PATCH", "/admin/api/tunnel", body);
      tunnelState.autostart = autostart;
      toast("Tunnel settings saved", "success");
    } catch (e) { toast(e.message, "error"); }
  });
}

  -H "Content-Type: application/json" \\
  -d '{
    "model": "deepseek/deepseek-chat",
    "messages": [{"role": "user", "content": "Hello!"}],
    "stream": true
  }'`;

    .then(() => toast("curl command copied", "success"))
    .catch(() => toast("Clipboard unavailable", "error"));
}

async function savePublicAccess(btn) {
  const enabled = $("#pa-enabled").checked;
  const requestsPerHour = parseInt($("#pa-rate").value, 10) || 30;
  const models = document.querySelector('input[name="pa-models"]:checked')?.value || "free";
  await withLoading(btn, async () => {
    try {
      await api("POST", "/admin/api/public-access", { enabled, requestsPerHour, models });
      const label = enabled
        ? (models === "all"
            ? `Public access ON — ALL models, ${requestsPerHour} req/IP/hour`
            : `Public access ON — FREE models only, ${requestsPerHour} req/IP/hour`)
        : "Public access OFF";
      toast(label, "success");
      render();
    } catch (e) { toast(e.message, "error"); }
  });
}

async function resetLogs() {
  confirmModal({
    title: "Clear All Request Logs?",
    message: "This will permanently delete all request logs. This cannot be undone.",
    confirmText: "Yes, Clear Logs",
    danger: true,
    onConfirm: async () => {
      try {
        const btn = document.querySelector("#resetLogsBtn");
        if (btn) btn.disabled = true;
        
        await api("DELETE", "/admin/api/logs/clear", {});
        toast("All logs cleared successfully", "success");
        setTimeout(renderSettings, 1000);
      } catch (e) {
        toast(e.message || "Failed to clear logs", "error");
      } finally {
        if (btn) btn.disabled = false;
      }
    },
  });
}

async function resetPoolEntries() {
  confirmModal({
    title: "Delete All Pool Entries?",
    message: "This will permanently delete all upstream API key pool entries. The legacy single-credential providers in config.json are not affected.",
    confirmText: "Yes, Delete Pool Entries",
    danger: true,
    onConfirm: async () => {
      try {
        const btn = document.querySelector("#resetPoolBtn");
        if (btn) btn.disabled = true;

        await api("POST", "/admin/api/pool/reset-all", {});
        toast("All pool entries deleted", "success");
        setTimeout(renderSettings, 1000);
      } catch (e) {
        toast(e.message || "Failed to delete pool entries", "error");
      } finally {
        if (btn) btn.disabled = false;
      }
    },
  });
}

async function resetAllData() {
  confirmModal({
    title: "🔥 DANGER: Factory Reset",
    message: "<strong>This will reset EVERYTHING:</strong><br/>• All request logs<br/>• All virtual keys<br/>• All usage counters<br/>• All token saver settings<br/><br/><strong>Your admin key and provider configurations will remain intact.</strong>",
    confirmText: "YES! Factory Reset!",
    danger: true,
    onConfirm: async () => {
      try {
        const btn = document.querySelector("#resetAllBtn");
        if (btn) btn.disabled = true;
        
        await api("POST", "/admin/api/settings/factory-reset", {});
        toast("Factory reset complete!", "success");
        setTimeout(() => {
          window.location.href = "/";
        }, 1500);
      } catch (e) {
        toast(e.message || "Failed to reset system", "error");
      } finally {
        if (btn) btn.disabled = false;
      }
    },
  });
}

async function exportConfig() {
  try {
    const response = await fetch("/admin/api/settings/export-config", {
      headers: getAuthHeaders(),
    });
    
    if (!response.ok) throw new Error("Failed to export config");
    
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `krouter-config-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Configuration exported!", "success");
  } catch (e) {
    toast(e.message || "Export failed", "error");
  }
}

async function exportLogs() {
  try {
    const response = await fetch("/admin/api/logs/export-csv", {
      headers: getAuthHeaders(),
    });
    
    if (!response.ok) throw new Error("Failed to export logs");
    
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `krouter-logs-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Logs exported to CSV!", "success");
  } catch (e) {
    toast(e.message || "Export failed", "error");
  }
}

function copyMcpConfig() {
  const origin = location.origin;
  const snippet = `{
  "mcp": {
    "servers": {
      "krouter": {
        "type": "http",
        "url": "${origin}/mcp",
        "headers": { "Authorization": "Bearer YOUR_ADMIN_OR_VIRTUAL_KEY" }
      }
    }
  }
}`;
  navigator.clipboard.writeText(snippet)
    .then(() => toast("ZCode MCP config copied", "success"))
    .catch(() => toast("Clipboard unavailable", "error"));
}

async function enableMcpTool(toolName) {
  try {
    const response = await api("POST", `/admin/api/mcp/tools/enable/${toolName}`, {});
    
    if (response.success) {
      toast(`${toolName} enabled successfully`, "success");
      renderMCP();
    } else {
      toast(response.error || "Failed to enable tool", "error");
    }
  } catch (e) {
    toast(e.message || "Failed to enable MCP tool", "error");
  }
}

async function testMcpConnection() {
  const endpoint = $("#mcpEndpoint").value.trim();
  
  if (!endpoint) {
    toast("Please enter MCP server endpoint", "warning");
    return;
  }
  
  try {
    const response = await api("POST", "/admin/api/mcp/test-connection", { endpoint });
    
    if (response.connected) {
      toast(`Connected to MCP server at ${endpoint}`, "success");
    } else {
      toast("Connection test failed", "error");
    }
  } catch (e) {
    toast(`Connection error: ${e.message}`, "error");
  }
}

async function saveMcpConfig() {
  const endpoint = $("#mcpEndpoint").value.trim();
  const timeout = $("#mcpTimeout").value;
  
  try {
    await api("PATCH", "/admin/api/mcp/config", {
      endpoint: endpoint || null,
      timeout: parseInt(timeout),
    });
    
    toast("MCP configuration saved!", "success");
  } catch (e) {
    toast(e.message || "Failed to save configuration", "error");
  }
}
