<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRouter - Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
      max-width: 420px;
      width: 90%;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    
    .content {
      padding: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1e5e9;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }
    
    .form-group input:focus {
      border-color: #667eea;
    }
    
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .message.error {
      background: #fee;
      color: #c00;
      display: block;
    }
    
    .message.success {
      background: #efe;
      color: #0a0;
      display: block;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 12px;
    }
    
    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }
    
    .links a {
      color: #667eea;
      text-decoration: none;
      margin: 0 10px;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
    
    .loading {
      position: relative;
      pointer-events: none;
    }
    
    .loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>KRouter</h1>
      <p>AI Gateway Authentication</p>
    </div>
    
    <div class="content">
      <div id="message" class="message"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Remember me (7 days)</label>
        </div>
        
        <button type="submit" class="btn-primary" id="loginBtn">Login</button>
      </form>
      
      <div class="links" style="display:grid;gap:8px">
        <a href="#" id="toggleChange" style="color:#7c8cff;text-decoration:none">Ganti password?</a>
        <span style="color:#999">No account? Ask the administrator to create one for you.</span>
      </div>

      <form id="changeForm" style="display:none;margin-top:16px;border-top:1px solid #2a2a3a;padding-top:16px">
        <div class="form-group">
          <label for="cp-username">Username</label>
          <input type="text" id="cp-username" autocomplete="username" placeholder="Your username" required>
        </div>
        <div class="form-group">
          <label for="cp-old">Password saat ini</label>
          <input type="password" id="cp-old" autocomplete="current-password" placeholder="Current password" required>
        </div>
        <div class="form-group">
          <label for="cp-new">Password baru (min. 6 karakter)</label>
          <input type="password" id="cp-new" autocomplete="new-password" placeholder="New password" required>
        </div>
        <button type="submit" class="btn-primary" id="cpBtn">Update Password</button>
      </form>
    </div>
    
    <div class="footer">
      KRouter AI Gateway v2.0 — self-registration disabled
    </div>
  </div>
  
  <script>
    const messageEl = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    
    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }
    
    async function handleSubmit(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }
      
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          showMessage('Login successful! Redirecting...', 'success');
          
          // Store session (handled by cookie)
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1000);
        } else {
          showMessage(data.error || 'Login failed', 'error');
        }
      } catch (err) {
        showMessage('Network error. Please try again.', 'error');
        console.error(err);
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    }
    
    // Change password flow (works straight from the login page)
    const changeForm = document.getElementById('changeForm');
    document.getElementById('toggleChange').addEventListener('click', (e) => {
      e.preventDefault();
      const show = changeForm.style.display === 'none';
      changeForm.style.display = show ? 'block' : 'none';
      document.getElementById('toggleChange').textContent = show ? 'Tutup form ganti password' : 'Ganti password?';
    });

    changeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('cp-username').value.trim();
      const oldPassword = document.getElementById('cp-old').value;
      const newPassword = document.getElementById('cp-new').value;
      if (!username || !oldPassword || !newPassword) {
        showMessage('Please fill in all fields', 'error');
        return;
      }
      if (newPassword.length < 6) {
        showMessage('New password must be at least 6 characters', 'error');
        return;
      }
      const cpBtn = document.getElementById('cpBtn');
      cpBtn.disabled = true;
      try {
        const response = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, oldPassword, newPassword }),
        });
        const data = await response.json();
        if (response.ok && data.success) {
          showMessage('Password changed. Login with the new password.', 'success');
          changeForm.style.display = 'none';
          document.getElementById('toggleChange').textContent = 'Ganti password?';
        } else {
          showMessage(data.error || 'Failed to change password', 'error');
        }
      } catch (err) {
        showMessage('Network error. Please try again.', 'error');
      } finally {
        cpBtn.disabled = false;
      }
    });

    function showCreateUser() {
      showMessage('Self-registration is disabled. Ask the administrator to create an account for you.', 'error');
    }
    
    document.getElementById('loginForm').addEventListener('submit', handleSubmit);
    
    // Check if already logged in
    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        const data = await response.json();
        
        if (data.authenticated) {
          window.location.href = '/index.html';
        }
      } catch (err) {
        // Not authenticated
      }
    }
    
    checkAuth();
  </script>
</body>
</html>
