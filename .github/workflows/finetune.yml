name: Fine-tune Rara (CPU)

on:
  workflow_dispatch:

# Cegah overlap: kalau ada run fine-tune lagi jalan, run baru otomatis
# cancel run lama (bukan nambah worker paralel).
concurrency:
  group: finetune-cpu
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/node_modules
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          df -h

      - name: Install dependencies (CPU-only)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers datasets huggingface_hub peft accelerate sentencepiece bitsandbytes
          df -h

      - name: Create training script
        run: |
          cat > train.py << 'TRAIN_EOF'
          import torch
          import os, json, sys
          from transformers import AutoModelForCausalLM, AutoTokenizer, TrainingArguments, Trainer, DataCollatorForSeq2Seq, BitsAndBytesConfig
          from peft import LoraConfig, get_peft_model, TaskType, prepare_model_for_kbit_training
          from datasets import load_dataset

          MODEL = "Qwen/Qwen2.5-7B-Instruct"
          DATA = "training-data/rara_training_v2.jsonl"
          OUT = "rara-model"
          os.makedirs(OUT, exist_ok=True)

          print(f"Device: CPU ({os.cpu_count()} cores)")
          print(f"RAM: {os.popen('free -h | head -2 | tail -1').read().strip()}")

          # Load tokenizer
          tokenizer = AutoTokenizer.from_pretrained(MODEL, trust_remote_code=True)
          if tokenizer.pad_token is None:
              tokenizer.pad_token = tokenizer.eos_token

          # Load model (CPU mode, 4-bit QLoRA via bitsandbytes).
          # 7B in float32 needs ~28 GB (won't fit 16 GB runner).
          # 7B in bfloat16 needs ~14 GB but bf16=True training crashes on
          # GitHub's CPU (no AVX-512 BF16 instructions).
          # 4-bit QLoRA: model loads in ~4-5 GB, training math in float32.
          # This is the canonical way to fit 7B in 16 GB RAM on CPU.
          bnb_config = BitsAndBytesConfig(
              load_in_4bit=True,
              bnb_4bit_quant_type="nf4",
              bnb_4bit_compute_dtype=torch.float32,  # CPU-safe compute dtype
              bnb_4bit_use_double_quant=True,
          )
          model = AutoModelForCausalLM.from_pretrained(
              MODEL,
              quantization_config=bnb_config,
              device_map="cpu",
              trust_remote_code=True,
              low_cpu_mem_usage=True,
          )

          # Prepare model for k-bit training: enable gradients on the
          # non-quantized layers (LoRA adapters) + disable KV cache.
          model = prepare_model_for_kbit_training(model)

          # LoRA config
          lora = LoraConfig(
              task_type=TaskType.CAUSAL_LM,
              r=16,
              lora_alpha=32,
              lora_dropout=0.05,
              target_modules=["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"],
          )
          model = get_peft_model(model, lora)

          # Required for gradient checkpointing + PEFT: LoRA adapters need
          # input tensors to require grad so backward can flow into them.
          model.enable_input_require_grads()

          # Heartbeat thread: print every 30s during training to keep
          # GitHub Actions runner alive. 7B step time is 4-8 minutes -
          # without heartbeat, GitHub may send shutdown signal after
          # several minutes of no stdout output.
          import threading, time
          _hb_stop = threading.Event()
          def _heartbeat():
              step = 0
              while not _hb_stop.is_set():
                  print(f"heartbeat {step}: still training {time.strftime('%H:%M:%S')}", flush=True)
                  step += 1
                  _hb_stop.wait(30)
          threading.Thread(target=_heartbeat, daemon=True).start()

          n_t = sum(p.numel() for p in model.parameters() if p.requires_grad)
          n_a = sum(p.numel() for p in model.parameters())
          print(f"Trainable: {n_t:,} / {n_a:,} ({100*n_t/n_a:.1f}%)")

          # Load dataset
          ds = load_dataset("json", data_files=DATA, split="train")
          SYS = 'Kamu Rara. Pakai Aku bukan Saya, kamu bukan Anda. Jawab singkat + ceria + emoji. Bahasa Indonesia santai.'

          def fmt(x):
              msgs = [dict(m) for m in x["messages"]]
              if msgs and msgs[0]["role"] == "system":
                  msgs[0]["content"] = SYS
              text = tokenizer.apply_chat_template(msgs, tokenize=False, add_generation_prompt=False)
              tokens = tokenizer(text, truncation=True, max_length=1024, return_tensors=None)
              tokens["labels"] = tokens["input_ids"].copy()
              return tokens

          ds = ds.map(fmt, remove_columns=ds.column_names)
          print(f"Dataset: {len(ds)} examples")

          # Training (CPU mode, 7B + bf16 + gradient checkpointing)
          # Penting: 7B di 4-core CPU ~4-8 menit/step (vs 6.58 detik/step
          # untuk 0.5B, 162 detik/step untuk 3B). 20 step = ~80-160 menit,
          # dalam batas 6 jam GitHub Actions runner.
          # gradient_checkpointing=True trade compute for memory (recompute
          # activations during backward) - necessary to fit 7B in 16 GB RAM.
          args = TrainingArguments(
              output_dir="./rara-ckpt",
              per_device_train_batch_size=1,
              gradient_accumulation_steps=4,
              max_steps=20,
              learning_rate=2e-4,
              warmup_steps=2,
              logging_steps=1,
              save_steps=10,
              save_total_limit=1,
              report_to="none",
              weight_decay=0.01,
              max_grad_norm=1.0,
              seed=42,
              lr_scheduler_type="cosine",
              fp16=False,
              bf16=False,
              gradient_checkpointing=True,
              gradient_checkpointing_kwargs={"use_reentrant": False},
              dataloader_num_workers=2,
              remove_unused_columns=False,
              disable_tqdm=False,
              logging_first_step=True,
          )

          collator = DataCollatorForSeq2Seq(tokenizer=tokenizer, padding=True)
          # transformers >= 4.46 mengganti arg `tokenizer=` menjadi `processing_class=`.
          # Pakai inspect biar kompatibel dua arah tanpa peduli versi terinstall.
          import inspect as _inspect
          _trainer_kwargs = dict(
              model=model,
              args=args,
              train_dataset=ds,
              data_collator=collator,
          )
          if 'processing_class' in _inspect.signature(Trainer).parameters:
              _trainer_kwargs['processing_class'] = tokenizer
          else:
              _trainer_kwargs['tokenizer'] = tokenizer
          trainer = Trainer(**_trainer_kwargs)

          print("Training started (CPU mode, 7B + bf16 + grad ckpt)...")
          stats = trainer.train()
          _hb_stop.set()  # stop heartbeat thread
          print(f"Done! Steps={stats.global_step} Loss={stats.training_loss:.4f}")

          # Save merged model (dequantized from 4-bit to float16).
          # bitsandbytes 4-bit weights can't be read by convert_hf_to_gguf.py
          # ("Quant method is not yet supported: 'bitsandbytes'"), so we:
          #   1. merge LoRA into base
          #   2. walk the module tree, dequantize every Linear4bit to float16
          #   3. clear model.config.quantization_config so HF converter
          #      doesn't try the bnb path.
          import torch.nn as nn
          import bitsandbytes as bnb

          def _dequant_recursive(parent_module):
              for name, child in list(parent_module.named_children()):
                  if isinstance(child, bnb.nn.Linear4bit) and hasattr(child.weight, 'quant_state'):
                      dequant_w = bnb.functional.dequantize_4bit(
                          child.weight.data, child.weight.quant_state
                      ).to(torch.float16)
                      new_linear = nn.Linear(
                          child.in_features, child.out_features,
                          bias=child.bias is not None,
                      )
                      new_linear.weight = nn.Parameter(dequant_w)
                      if child.bias is not None:
                          new_linear.bias = nn.Parameter(child.bias.data.to(torch.float16))
                      setattr(parent_module, name, new_linear)
                  else:
                      _dequant_recursive(child)

          model = model.merge_and_unload()
          _dequant_recursive(model)
          model = model.to(torch.float16)
          if hasattr(model, 'config') and hasattr(model.config, 'quantization_config'):
              model.config.quantization_config = None
          model.save_pretrained(OUT, safe_serialization=True)
          tokenizer.save_pretrained(OUT)
          print(f"Model saved to {OUT} (dequantized to float16)")
          TRAIN_EOF

      - name: Train (CPU mode)
        # -u = python unbuffered stdout, biar output keluar real-time
        # ke log GitHub Actions (cegah false-positive idle runner kill).
        run: |
          python3 -u train.py

      - name: Get llama.cpp scripts
        # llama.cpp's Makefile is deprecated; modern build needs CMake.
        # We don't actually need the C++ `llama-quantize` binary — the Python
        # `convert_hf_to_gguf.py` script can do q8_0 quantization in-script
        # via `--outtype q8_0`. So we just clone for the script.
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp /tmp/llama.cpp
          ls /tmp/llama.cpp/convert_hf_to_gguf.py
          echo "llama.cpp scripts ready"

      - name: Convert to GGUF (q8_0 quantized in-script)
        # q8_0 = 8-bit quantization. Done by convert_hf_to_gguf.py itself,
        # no separate llama-quantize binary needed.
        # Output for 0.5B model: ~500 MB (vs 1.98 GB for f32).
        run: |
          cd /tmp/llama.cpp
          python convert_hf_to_gguf.py $GITHUB_WORKSPACE/rara-model --outtype q8_0 --outfile /tmp/rara-q8_0.gguf
          ls -lh /tmp/rara-q8_0.gguf
          cp /tmp/rara-q8_0.gguf $GITHUB_WORKSPACE/rara-q8_0.gguf

      - name: Upload to HuggingFace
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          from huggingface_hub import create_repo, upload_file
          from huggingface_hub.utils import HfHubHTTPError
          import os, sys
          token = os.environ.get('HF_TOKEN', '')
          if not token:
              print('WARNING: HF_TOKEN secret not set! Skipping upload.')
              print('GGUF file is at: rara-q8_0.gguf (artifact, see Actions run page)')
              sys.exit(0)
          try:
              create_repo('kangwifi/rara-ai', token=token, exist_ok=True, private=False)
              upload_file(path_or_fileobj='rara-q8_0.gguf', path_in_repo='rara-q8_0.gguf', repo_id='kangwifi/rara-ai', token=token)
              print('Uploaded -> huggingface.co/kangwifi/rara-ai')
          except Exception as e:
              print(f'WARNING: HF upload failed: {e}')
              print('Likely causes:')
              print('  - HF_TOKEN secret expired or revoked')
              print('  - Token has no write access to kangwifi/rara-ai')
              print('  - Token belongs to a different HF account')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> HF_TOKEN')
              print('     Set to a HuggingFace access token with WRITE permission.')
              print('The GGUF file is still built at rara-q8_0.gguf — see workflow artifacts.')
              sys.exit(0)  # soft-fail: continue to deploy commands
          "

      - name: Deploy commands
        if: always()
        run: |
          echo "============================================"
          echo "DEPLOY KE SERVER:"
          echo "docker exec kali ollama pull hf.co/kangwifi/rara-ai:rara-q8_0.gguf"
          echo "echo 'MODEL=hf.co/kangwifi/rara-ai:rara-q8_0.gguf' >> /opt/rara-agent/.env"
          echo "docker exec kali pm2 restart rara-web"
          echo "============================================"
