name: Fine-tune Rara

on:
  workflow_dispatch:
    description: "Train Rara AI model (QLoRA Qwen2.5-7B → GGUF → HuggingFace)"
  push:
    paths:
      - 'training-data/rara_training_v2.jsonl'
      - '.github/workflows/finetune.yml'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cu121
          pip install -q unsloth datasets huggingface_hub
          pip install -q llama-cpp-python

      - name: Load model + dataset + train
        run: |
          python3 -c "
          from unsloth import FastLanguageModel
          from datasets import load_dataset

          model, tokenizer = FastLanguageModel.from_pretrained(
              'Qwen/Qwen2.5-7B-Instruct',
              load_in_4bit=True,
              max_seq_length=4096,
          )
          model = FastLanguageModel.get_peft_model(model,
              r=64,
              target_modules=['q_proj','k_proj','v_proj','o_proj','gate_proj','up_proj','down_proj'],
              lora_alpha=128,
              lora_dropout=0.05,
              use_gradient_checkpointing='unsloth',
          )

          ds = load_dataset('json', data_files='training-data/rara_training_v2.jsonl', split='train')
          SYS = 'Kamu Rara. Pakai Aku bukan Saya. Jawab singkat + ceria + emoji. Bahasa Indonesia santai.'
          def fmt(x):
              msgs = x['messages']
              if msgs and msgs[0]['role'] == 'system':
                  msgs[0]['content'] = SYS
              return {'text': tokenizer.apply_chat_template(msgs, tokenize=False, add_generation_prompt=False)}
          ds = ds.map(fmt)
          print(f'{len(ds)} examples loaded')

          from unsloth import UnslothTrainer, UnslothTrainingArguments
          trainer = UnslothTrainer(
              model=model, tokenizer=tokenizer, train_dataset=ds,
              dataset_text_field='text', max_seq_length=4096,
              args=UnslothTrainingArguments(
                  per_device_train_batch_size=2,
                  gradient_accumulation_steps=4,
                  max_steps=200,
                  learning_rate=1e-4,
                  warmup_steps=15,
                  logging_steps=5,
                  save_steps=50,
                  output_dir='rara-ckpt',
                  report_to='none',
                  weight_decay=0.01,
                  max_grad_norm=1.0,
                  seed=42,
                  lr_scheduler_type='cosine',
              ),
          )
          stats = trainer.train()
          print(f'Training done! Steps={stats.global_step} Loss={stats.training_loss:.4f}')

          model.save_pretrained_merged('rara-model', tokenizer, save_method='merged_16bit')
          print('Model saved')
          "

      - name: Convert to GGUF
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp
          cd llama.cpp && make -j$(nproc)
          python convert_hf_to_gguf.py ../rara-model --outtype f16 --outfile ../rara.gguf
          ./llama-quantize ../rara.gguf ../rara-q4.gguf Q4_K_M
          ls -lh ../rara-q4.gguf

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          from huggingface_hub import create_repo, upload_file
          import os
          create_repo('kangwifi/rara-ai', token=os.environ['HF_TOKEN'], exist_ok=True)
          upload_file('rara-q4.gguf', 'rara-q4.gguf', 'kangwifi/rara-ai', token=os.environ['HF_TOKEN'])
          print('Uploaded → huggingface.co/kangwifi/rara-ai')
          "

      - name: Deploy to server
        if: success()
        run: |
          echo "Deploy commands:"
          echo "docker exec kali ollama pull hf.co/kangwifi/rara-ai:rara-q4.gguf"
          echo "echo 'MODEL=hf.co/kangwifi/rara-ai:rara-q4.gguf' >> /opt/rara-agent/.env"
          echo "docker exec kali pm2 restart rara-web"
