name: Fine-tune Rara (CPU)

on:
  workflow_dispatch:

# Cegah overlap: kalau ada run fine-tune lagi jalan, run baru otomatis
# cancel run lama (bukan nambah worker paralel).
concurrency:
  group: finetune-cpu
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/node_modules
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          df -h

      - name: Install dependencies (CPU-only)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers datasets huggingface_hub peft accelerate
          df -h

      - name: Create training script
        run: |
          cat > train.py << 'TRAIN_EOF'
          import torch
          import os, json, sys
          from transformers import AutoModelForCausalLM, AutoTokenizer, TrainingArguments, Trainer, DataCollatorForSeq2Seq
          from peft import LoraConfig, get_peft_model, TaskType
          from datasets import load_dataset

          MODEL = "Qwen/Qwen2.5-3B-Instruct"
          DATA = "training-data/rara_training_v2.jsonl"
          OUT = "rara-model"
          os.makedirs(OUT, exist_ok=True)

          print(f"Device: CPU ({os.cpu_count()} cores)")
          print(f"RAM: {os.popen('free -h | head -2 | tail -1').read().strip()}")

          # Load tokenizer
          tokenizer = AutoTokenizer.from_pretrained(MODEL, trust_remote_code=True)
          if tokenizer.pad_token is None:
              tokenizer.pad_token = tokenizer.eos_token

          # Load model (CPU mode, float32)
          model = AutoModelForCausalLM.from_pretrained(
              MODEL,
              torch_dtype=torch.float32,
              device_map="cpu",
              trust_remote_code=True,
              low_cpu_mem_usage=True,
          )

          # LoRA config
          lora = LoraConfig(
              task_type=TaskType.CAUSAL_LM,
              r=16,
              lora_alpha=32,
              lora_dropout=0.05,
              target_modules=["q_proj","k_proj","v_proj","o_proj","gate_proj","up_proj","down_proj"],
          )
          model = get_peft_model(model, lora)

          n_t = sum(p.numel() for p in model.parameters() if p.requires_grad)
          n_a = sum(p.numel() for p in model.parameters())
          print(f"Trainable: {n_t:,} / {n_a:,} ({100*n_t/n_a:.1f}%)")

          # Load dataset
          ds = load_dataset("json", data_files=DATA, split="train")
          SYS = 'Kamu Rara. Pakai Aku bukan Saya, kamu bukan Anda. Jawab singkat + ceria + emoji. Bahasa Indonesia santai.'

          def fmt(x):
              msgs = [dict(m) for m in x["messages"]]
              if msgs and msgs[0]["role"] == "system":
                  msgs[0]["content"] = SYS
              text = tokenizer.apply_chat_template(msgs, tokenize=False, add_generation_prompt=False)
              tokens = tokenizer(text, truncation=True, max_length=1024, return_tensors=None)
              tokens["labels"] = tokens["input_ids"].copy()
              return tokens

          ds = ds.map(fmt, remove_columns=ds.column_names)
          print(f"Dataset: {len(ds)} examples")

          # Training (CPU mode)
          args = TrainingArguments(
              output_dir="./rara-ckpt",
              per_device_train_batch_size=1,
              gradient_accumulation_steps=8,
              max_steps=100,
              learning_rate=2e-4,
              warmup_steps=10,
              logging_steps=5,
              save_steps=50,
              save_total_limit=1,
              report_to="none",
              weight_decay=0.01,
              max_grad_norm=1.0,
              seed=42,
              lr_scheduler_type="cosine",
              fp16=False,
              bf16=False,
              dataloader_num_workers=2,
              remove_unused_columns=False,
          )

          collator = DataCollatorForSeq2Seq(tokenizer=tokenizer, padding=True)
          # transformers >= 4.46 mengganti arg `tokenizer=` menjadi `processing_class=`.
          # Pakai inspect biar kompatibel dua arah tanpa peduli versi terinstall.
          import inspect as _inspect
          _trainer_kwargs = dict(
              model=model,
              args=args,
              train_dataset=ds,
              data_collator=collator,
          )
          if 'processing_class' in _inspect.signature(Trainer).parameters:
              _trainer_kwargs['processing_class'] = tokenizer
          else:
              _trainer_kwargs['tokenizer'] = tokenizer
          trainer = Trainer(**_trainer_kwargs)

          print("Training started (CPU mode)...")
          stats = trainer.train()
          print(f"Done! Steps={stats.global_step} Loss={stats.training_loss:.4f}")

          # Save merged model
          model = model.merge_and_unload()
          model.save_pretrained(OUT)
          tokenizer.save_pretrained(OUT)
          print(f"Model saved to {OUT}")
          TRAIN_EOF

      - name: Train (CPU mode)
        run: |
          python3 train.py

      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp /tmp/llama.cpp
          cd /tmp/llama.cpp && make -j$(nproc) 2>&1 | tail -1
          echo "llama.cpp built"

      - name: Convert to GGUF
        run: |
          cd /tmp/llama.cpp
          python convert_hf_to_gguf.py $GITHUB_WORKSPACE/rara-model --outtype f32 --outfile /tmp/rara-f32.gguf
          ./llama-quantize /tmp/rara-f32.gguf /tmp/rara-q4.gguf Q4_K_M
          ls -lh /tmp/rara-q4.gguf
          cp /tmp/rara-q4.gguf $GITHUB_WORKSPACE/rara-q4.gguf

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          from huggingface_hub import create_repo, upload_file
          import os
          token = os.environ.get('HF_TOKEN', '')
          if not token:
              print('WARNING: HF_TOKEN secret not set! Skipping upload.')
              exit(0)
          create_repo('kangwifi/rara-ai', token=token, exist_ok=True, private=False)
          upload_file('rara-q4.gguf', 'rara-q4.gguf', 'kangwifi/rara-ai', token=token)
          print('Uploaded -> huggingface.co/kangwifi/rara-ai')
          "

      - name: Deploy commands
        if: success()
        run: |
          echo "============================================"
          echo "DEPLOY KE SERVER:"
          echo "docker exec kali ollama pull hf.co/kangwifi/rara-ai:rara-q4.gguf"
          echo "echo 'MODEL=hf.co/kangwifi/rara-ai:rara-q4.gguf' >> /opt/rara-agent/.env"
          echo "docker exec kali pm2 restart rara-web"
          echo "============================================"
