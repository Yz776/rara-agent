# ─────────────────────────────────────────────────────────────────────────────
# Rara Agent — build + push Docker image to GitHub Container Registry (GHCR)
#
# Triggers:
#   - push to main              → build + tag :latest + :sha-<short>
#   - tag v*.*.*                → build + tag :<version> + :latest
#   - manual dispatch           → build on-demand
#
# Output image: ghcr.io/yz776/rara-agent
#
# No external creds needed — uses the auto-provided GITHUB_TOKEN with
# packages:write permission (granted below).
#
# After a successful build, operators pull the new image with:
#   docker pull ghcr.io/yz776/rara-agent:latest
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
name: Build + Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build + push (amd64 first for speed; arm64 added once build is stable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Image digest pushed ${{ steps.meta.outputs.tags }}"
